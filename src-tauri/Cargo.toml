[package]
name = "konfix-desktop"
version = "2026.10.6"
description = "KoNfiX — Der visuelle KNX-Konfigurator (Desktop Application)"
authors = ["Torsten Sdun", "KoNfiX Team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Sduniii/KoNfiX"
edition = "2021"

[lib]
name = "konfix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
knx-core = { path = "../crates/knx-core" }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
