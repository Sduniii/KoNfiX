[package]
name = "knx-core"
version = "2026.10.1"
edition = "2021"
default-run = "konfix"
license = "AGPL-3.0-or-later"
description = "KoNfiX — Der visuelle KNX-Konfigurator (Core Engine & Web Server)"
repository = "https://github.com/Sduniii/KoNfiX"

[[bin]]
name = "konfix"
path = "src/main.rs"

[[bin]]
name = "knx_sniffer"
path = "src/bin/knx_sniffer.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1.3"
futures-util = "0.3"
quick-xml = { version = "0.36", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
zip = { version = "8.6.0", features = ["deflate", "aes-crypto"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"
rsa = { version = "0.9", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
subtle = "2.5"


[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

